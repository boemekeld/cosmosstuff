# Generated by the bohr v2 migration. Deploys every branch to bohr.io Cloud except homolog, the bohr
# agent's preview branch: its changes are not approved yet and must not run with the build secrets.
name: Deploy to bohr.io
on:
  push:
    branches: ['**', '!homolog']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: bohr-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "16"
      - name: Build variables
        env:
          BOHR_SECRETS: ${{ toJSON(secrets) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomUUID } = require('node:crypto');
          for (const [name, value] of Object.entries(JSON.parse(process.env.BOHR_SECRETS))) {
            if (!name.startsWith('BOHR_BUILD_')) continue;
            const end = 'EOF' + randomUUID().replaceAll('-', '');
            fs.appendFileSync(process.env.GITHUB_ENV, name.slice(11) + '<<' + end + '\n' + value + '\n' + end + '\n');
          }
          NODE
      - name: Install
        run: "npm install --force"
      - name: Build
        run: "ng build"
        env:
          CI: "false"
      - name: Node for the deploy (wrangler needs 22+)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: bohr-io/deploy-action@v1
